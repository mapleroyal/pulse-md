<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Pulse MD — Recovery</title>
    <style>
      :root {
        color-scheme: light;
        --recovery-background: #ffffff;
        --recovery-foreground: #171717;
        --recovery-muted: color-mix(
          in oklab,
          var(--recovery-foreground) 62%,
          transparent
        );
        --recovery-border: color-mix(
          in oklab,
          var(--recovery-foreground) 14%,
          transparent
        );
        --recovery-surface: color-mix(
          in oklab,
          var(--recovery-background) 92%,
          var(--recovery-foreground)
        );
        --recovery-window-zoom: 1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--recovery-background);
        color: var(--recovery-foreground);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .recovery-drag-region {
        position: fixed;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        height: 44px;
        -webkit-app-region: drag;
      }

      html[data-platform="linux"] .recovery-drag-region {
        right: calc(138px / var(--recovery-window-zoom));
      }

      .recovery-window-controls {
        position: fixed;
        z-index: 2;
        top: 0;
        right: 0;
        display: none;
        height: 46px;
        color: var(--recovery-foreground);
        -webkit-app-region: no-drag;
      }

      html[data-platform="linux"] .recovery-window-controls {
        display: flex;
      }

      .recovery-window-control {
        position: relative;
        display: grid;
        width: calc(46px / var(--recovery-window-zoom));
        min-height: 0;
        height: 100%;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        outline: none;
      }

      .recovery-window-control:not(.recovery-window-control-close):hover,
      .recovery-window-control:not(
          .recovery-window-control-close
        ):focus-visible {
        background: color-mix(
          in oklab,
          var(--recovery-foreground) 12%,
          transparent
        );
      }

      .recovery-window-control:not(.recovery-window-control-close):active {
        background: color-mix(
          in oklab,
          var(--recovery-foreground) 20%,
          transparent
        );
      }

      .recovery-window-control-close:hover,
      .recovery-window-control-close:focus-visible {
        background: #c42b1c;
        color: #ffffff;
      }

      .recovery-window-control-close:active {
        background: #b22a1f;
        color: #ffffff;
      }

      .recovery-window-control svg {
        width: calc(10px / var(--recovery-window-zoom));
        height: calc(10px / var(--recovery-window-zoom));
        fill: none;
        stroke: currentColor;
      }

      .recovery-restore-glyph,
      .recovery-window-control[data-maximized="true"] .recovery-maximize-glyph {
        display: none;
      }

      .recovery-window-control[data-maximized="true"] .recovery-restore-glyph {
        display: block;
      }

      main {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 56px 24px 24px;
      }

      section {
        display: grid;
        width: min(32rem, 100%);
        gap: 16px;
        padding: 28px;
        border: 1px solid var(--recovery-border);
        border-radius: 24px;
        background: var(--recovery-surface);
        box-shadow: 0 18px 50px color-mix(in oklab, #000000 14%, transparent);
      }

      .recovery-mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--recovery-border);
        border-radius: 12px;
        font-size: 22px;
        font-weight: 600;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.3rem, 4vw, 1.65rem);
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--recovery-muted);
        font-size: 0.925rem;
        line-height: 1.55;
      }

      .recovery-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      button {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid var(--recovery-border);
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 550;
        cursor: default;
        -webkit-app-region: no-drag;
      }

      button[data-primary] {
        border-color: var(--recovery-foreground);
        background: var(--recovery-foreground);
        color: var(--recovery-background);
      }

      button:hover:not(:disabled) {
        background: color-mix(
          in oklab,
          var(--recovery-foreground) 9%,
          transparent
        );
      }

      button[data-primary]:hover:not(:disabled) {
        background: color-mix(
          in oklab,
          var(--recovery-foreground) 88%,
          var(--recovery-background)
        );
      }

      button:focus-visible {
        outline: 2px solid var(--recovery-foreground);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.5;
      }

      #recovery-status:empty {
        display: none;
      }

      @media (max-width: 420px), (max-height: 360px) {
        main {
          align-items: start;
          padding: 48px 12px 12px;
          overflow-y: auto;
        }

        section {
          gap: 12px;
          padding: 18px;
          border-radius: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div aria-hidden="true" class="recovery-drag-region"></div>
    <div aria-label="Window controls" class="recovery-window-controls">
      <button
        aria-label="Minimize window"
        class="recovery-window-control"
        data-window-action="minimize"
        title="Minimize"
        type="button"
      >
        <svg aria-hidden="true" viewBox="0 0 10 10">
          <path d="M0 9.5h10" />
        </svg>
      </button>
      <button
        aria-label="Maximize window"
        class="recovery-window-control"
        data-window-action="toggle-maximize"
        title="Maximize"
        type="button"
      >
        <svg
          aria-hidden="true"
          class="recovery-maximize-glyph"
          viewBox="0 0 10 10"
        >
          <rect height="9" width="9" x="0.5" y="0.5" />
        </svg>
        <svg
          aria-hidden="true"
          class="recovery-restore-glyph"
          viewBox="0 0 10 10"
        >
          <rect height="7" width="7" x="2.5" y="0.5" />
          <path d="M2.5 2.5h-2v7h7v-2" />
        </svg>
      </button>
      <button
        aria-label="Close window"
        class="recovery-window-control recovery-window-control-close"
        data-window-action="close"
        title="Close"
        type="button"
      >
        <svg aria-hidden="true" viewBox="0 0 10 10">
          <path d="m1 1 8 8m0-8-8 8" />
        </svg>
      </button>
    </div>
    <main>
      <section aria-labelledby="recovery-title">
        <div aria-hidden="true" class="recovery-mark">!</div>
        <h1 id="recovery-title">The editor needs to recover</h1>
        <p id="recovery-description">
          The document interface stopped unexpectedly. Files already saved to
          disk are safe; changes that had not been saved may not be recoverable.
        </p>
        <div class="recovery-actions">
          <button data-action="reload" data-primary type="button">
            Reload Window
          </button>
          <button data-action="reopen" type="button">Reopen App</button>
          <button data-action="quit" type="button">Quit</button>
        </div>
        <p aria-live="assertive" id="recovery-status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/recovery.ts"></script>
  </body>
</html>
